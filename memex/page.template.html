<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Library</title>
<style>
:root{
  --bg:#fbfaf7; --panel:#f3f1ec; --line:#e2ded4; --ink:#23211d;
  --dim:#6f6a60; --faint:#9a9489; --accent:#8a5a2b; --vault:#7a3b52;
  --board:#cfc7b5;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16150f; --panel:#1d1b16; --line:#2f2c25; --ink:#e6e1d6;
         --dim:#9c968a; --faint:#6d675c; --accent:#d2a06a; --vault:#d98aa6;
         --board:#413b31; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--accent)}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:290px 1fr;height:100vh}
#side{border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#main{overflow-y:auto;min-width:0;position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;cursor:grab}
#map.on{display:block}
#map:active{cursor:grabbing}
#maphint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--faint);
  pointer-events:none;letter-spacing:.04em}
body.mapping #reader{display:none}

/* ---------- sidebar ---------- */
#brand{padding:18px 18px 10px}
#brand h1{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
#brand p{margin:3px 0 0;color:var(--faint);font-size:12px}
#views{display:flex;gap:4px;margin:10px 14px 8px}
#views button{flex:1;padding:6px;border:1px solid var(--line);border-radius:6px;
  background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase}
#views button.on{background:var(--bg);color:var(--ink);border-color:var(--accent)}
#q{margin:0 14px 10px;padding:8px 10px;width:calc(100% - 28px);
  background:var(--bg);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);font:inherit;font-size:13px}
#q:focus{outline:none;border-color:var(--accent)}
#shelves{overflow-y:auto;padding:0 8px 20px;flex:1;min-height:0}
/* a shelf: its label, the board it sits on, the Books resting below */
.shelf{display:flex;align-items:baseline;gap:8px;width:100%;
  margin:22px 0 0;padding:4px 6px 7px;border:0;border-bottom:2px solid var(--board);
  background:none;cursor:pointer;text-align:left;font:inherit;
  font-size:14.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink)}
.shelf:first-child{margin-top:6px}
.shelf:hover{border-bottom-color:var(--accent)}
.shelf .chev{flex:none;color:var(--faint);font-size:9px;
  transition:transform .12s ease;transform:rotate(90deg)}
.shelf.shut .chev{transform:rotate(0deg)}
.shelf.shut{border-bottom-style:dotted}
.shelf .n{margin-left:auto;font-size:11px;font-weight:400;letter-spacing:.04em;
  color:var(--faint);font-variant-numeric:tabular-nums}
.books{margin:4px 0 0;padding:0 0 2px 4px}
.shelf.shut + .books{display:none}
.empty-note{margin:16px 10px;font-size:12.5px;color:var(--faint)}
.item{display:block;width:100%;text-align:left;padding:5px 10px;border:0;
  border-radius:5px;background:none;color:var(--dim);font:inherit;font-size:13.5px;
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:var(--bg);color:var(--ink)}
.item.on{background:var(--bg);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.item .lockdot{color:var(--vault)}

/* ---------- lock ---------- */
#lock{margin:8px 14px 14px;padding:12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg)}
#lock h2{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--vault)}
#lock p{margin:0 0 8px;font-size:12px;color:var(--faint);line-height:1.5}
#lock input{width:100%;padding:7px 9px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;color:var(--ink);font:inherit;font-size:13px}
#lock input:focus{outline:none;border-color:var(--vault)}
#lock button{margin-top:7px;width:100%;padding:7px;border:1px solid var(--line);
  border-radius:5px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#lock button:hover{border-color:var(--vault)}
#lockmsg{margin:7px 0 0;font-size:12px;color:var(--vault)}

/* ---------- reader ---------- */
#reader{max-width:760px;margin:0 auto;padding:46px 40px 120px}
#empty{color:var(--faint);padding-top:8vh}
#empty h2{color:var(--ink);font-size:20px;margin:0 0 10px;font-weight:600}
#empty ul{padding-left:18px;font-size:14px}
.crumb{font-size:12px;color:var(--faint);font-family:var(--mono)}
#reader h1.bt{margin:6px 0 10px;font-size:27px;line-height:1.25;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.tag.v{color:var(--vault);border-color:var(--vault)}

.doc>:first-child{margin-top:0}
.doc h1,.doc h2,.doc h3{line-height:1.3;font-weight:600;margin:1.9em 0 .5em}
.doc h1{font-size:21px} .doc h2{font-size:17px} .doc h3{font-size:15px;color:var(--dim)}
.doc p,.doc li{overflow-wrap:break-word}
.doc blockquote{margin:1.2em 0;padding:2px 0 2px 16px;border-left:2px solid var(--line);
  color:var(--dim);font-style:italic}
.doc code{font-family:var(--mono);font-size:.87em;background:var(--panel);
  padding:1px 5px;border-radius:4px}
.doc pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;overflow-x:auto}
.doc pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--panel)}
.doc hr{border:0;border-top:1px solid var(--line);margin:2em 0}
a.wl{cursor:pointer;text-decoration:none;border-bottom:1px solid var(--line)}
a.wl:hover{border-bottom-color:var(--accent)}
a.wl.dangling{color:var(--faint);border-bottom-style:dashed;cursor:help}
a.wl.vaultref{color:var(--vault);border-bottom-style:dotted;cursor:help;
  font-variant:all-small-caps;letter-spacing:.05em}

details.appendix{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
details.appendix summary{cursor:pointer;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);list-style:none}
details.appendix summary::before{content:"+ ";font-family:var(--mono)}
details.appendix[open] summary::before{content:"- "}
.links{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;font-size:13px}
.links h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);font-weight:600}
.links ul{margin:0 0 16px;padding-left:16px;color:var(--dim)}

@media (pointer:coarse){
  .item{padding:9px 10px;font-size:15px}
  .shelf{padding:9px 8px;font-size:15px}
  #q,#lock input,#lock button{padding:11px 10px;font-size:16px}  /* 16px: no ios zoom */
  details.appendix summary{padding:6px 0}
}
#live{float:right;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint)}
#live.beat{color:var(--accent)}
@media (max-width:820px){
  #shell{grid-template-columns:1fr;height:auto}
  #side{border-right:0;border-bottom:1px solid var(--line);max-height:52vh}
  #reader{padding:26px 20px 80px}
}
</style>
</head>
<body>
<div id="shell">
  <aside id="side">
    <div id="brand">
      <h1>The Library</h1>
      <p id="sub"><span id="live"></span></p>
    </div>
    <div id="views">
      <button id="v-list" class="on">Books</button>
      <button id="v-map">Map</button>
    </div>
    <input id="q" type="search" placeholder="search the Library    /" autocomplete="off">
    <div id="lock" hidden>
      <h2>Vault</h2>
      <p id="lockp"></p>
      <input id="pass" type="password" placeholder="passphrase" autocomplete="off">
      <button id="unlock">Unlock</button>
      <p id="lockmsg" hidden></p>
    </div>
    <nav id="shelves"></nav>
  </aside>
  <main id="main">
    <canvas id="map"></canvas>
    <div id="maphint" hidden>drag to pan · pinch or scroll to zoom · tap a Book</div>
    <div id="reader">
      <div id="empty">
        <h2>Pick a Book.</h2>
        <ul>
          <li>Every Book is one markdown file under <code>brain/</code>.</li>
          <li>Above the line is compiled truth; the appendix below it is append-only.</li>
          <li><span style="border-bottom:1px solid var(--line)">Wiki-links</span> in the text are clickable — that is the trail.</li>
        </ul>
      </div>
    </div>
  </main>
</div>

<script id="public-data" type="application/json">__PUBLIC__</script>
<script id="locked-data" type="application/json">__LOCKED__</script>
<script id="counts-data" type="application/json">__COUNTS__</script>
<script>
(function(){
"use strict";
const J = id => JSON.parse(document.getElementById(id).textContent);
let BOOKS = J("public-data") || [];
let LOCKED = J("locked-data");
let COUNTS = J("counts-data");
const LIVE = !!(COUNTS && COUNTS.live);

const $ = s => document.querySelector(s);
const byId = () => Object.fromEntries(BOOKS.map(b => [b.slug, b]));
let INDEX = byId();
let VAULTMAP = null;      // token -> slug, only after unlock

/* which shelves are folded shut — remembered per browser */
const SHUT = new Set((() => {
  try { return JSON.parse(localStorage.getItem("memex-shut") || "[]"); }
  catch(_) { return []; }
})());
function toggleShelf(shelf){
  SHUT.has(shelf) ? SHUT.delete(shelf) : SHUT.add(shelf);
  try { localStorage.setItem("memex-shut", JSON.stringify([...SHUT])); } catch(_){}
}
let current = null;

/* ---------- sidebar ---------- */
function draw(filter){
  const f = (filter || "").trim().toLowerCase();
  const hits = f ? BOOKS.filter(b =>
      b.title.toLowerCase().includes(f) || b.slug.includes(f) || b.text.includes(f))
    : BOOKS.slice();
  hits.sort((a,b) => a.slug.localeCompare(b.slug));

  const shelves = new Map();
  for (const b of hits){
    if (!shelves.has(b.shelf)) shelves.set(b.shelf, []);
    shelves.get(b.shelf).push(b);
  }
  const nav = $("#shelves");
  nav.textContent = "";
  if (!hits.length){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = "nothing matches";
    nav.append(p);
    return;
  }
  for (const [shelf, list] of shelves){
    // searching opens every shelf; otherwise remember what was folded away
    const shut = !f && SHUT.has(shelf);
    const h = document.createElement("button");
    h.className = "shelf" + (shut ? " shut" : "");
    const chev = document.createElement("span");
    chev.className = "chev"; chev.textContent = "\u25B8";
    const name = document.createElement("span");
    name.textContent = shelf;
    const n = document.createElement("span");
    n.className = "n"; n.textContent = list.length;
    h.append(chev, name, n);
    h.onclick = () => { toggleShelf(shelf); draw($("#q").value); };
    nav.append(h);

    const box = document.createElement("div");
    box.className = "books";
    for (const b of list){
      const el = document.createElement("button");
      el.className = "item" + (b.slug === current ? " on" : "");
      el.dataset.slug = b.slug;
      el.title = b.slug;
      el.textContent = b.title;
      if (b.vault){
        const d = document.createElement("span");
        d.className = "lockdot"; d.textContent = " · vault";
        el.append(d);
      }
      el.onclick = () => open(b.slug);
      box.append(el);
    }
    nav.append(box);
  }
}

/* ---------- reader ---------- */
function deref(s){
  if (!s.startsWith("vault:")) return s;
  return VAULTMAP ? (VAULTMAP[s.slice(6)] || null) : null;
}
function linkList(title, slugs){
  const known = slugs.map(deref).filter(s => s && INDEX[s]);
  if (!known.length) return "";
  const items = known.map(s =>
    `<li><a class="wl" href="#${s}" data-slug="${s}">${esc(INDEX[s].title)}</a></li>`).join("");
  return `<h3>${title}</h3><ul>${items}</ul>`;
}
function esc(s){
  return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function open(slug){
  const b = INDEX[slug];
  if (!b) return;
  current = slug;
  if (location.hash.slice(1) !== slug) history.replaceState(null, "", "#" + slug);

  const tags = [b.type, b.created && ("created " + b.created), b.words + " words"]
    .filter(Boolean)
    .map(t => `<span class="tag">${esc(String(t))}</span>`);
  if (b.vault) tags.unshift('<span class="tag v">vault</span>');

  const body = b.omitted
    ? `<p style="color:var(--faint)">This Book is <strong>vault</strong>. It was not
       written into this page — rebuild with a passphrase to include it.</p>`
    : (b.facts || "<p style='color:var(--faint)'>(no compiled truth yet)</p>");

  const appendix = b.appendix
    ? `<details class="appendix"><summary>appendix — trail and timeline</summary>
       <div class="doc">${b.appendix}</div></details>` : "";

  const rel = linkList("Links out", b.links) + linkList("Linked from", b.backlinks);

  $("#reader").innerHTML =
    `<div class="crumb">${esc(b.slug)}.md</div>
     <h1 class="bt">${esc(b.title)}</h1>
     <div class="meta">${tags.join("")}</div>
     <div class="doc">${body}</div>
     ${appendix}
     ${rel ? `<div class="links">${rel}</div>` : ""}`;
  if (VAULTMAP){
    for (const a of $("#reader").querySelectorAll("a.vaultref[data-vault]")){
      const slug = VAULTMAP[a.dataset.vault];
      if (!slug || !INDEX[slug]) continue;
      a.classList.remove("vaultref");
      a.dataset.slug = slug;
      a.href = "#" + slug;
      a.textContent = INDEX[slug].title;
    }
  }
  $("#main").scrollTop = 0;
  draw($("#q").value);
}

/* wiki-links anywhere in the page */
document.addEventListener("click", e => {
  const a = e.target.closest("a.wl[data-slug]");
  if (!a) return;
  e.preventDefault();
  open(a.dataset.slug);
});

/* ---------- vault ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass){
  if (!window.crypto || !crypto.subtle)
    throw new Error("this browser exposes no WebCrypto here");
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2",
                                             false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(LOCKED.salt), iterations:LOCKED.iterations, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64(LOCKED.iv)}, key, b64(LOCKED.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function admit(payload){
  VAULTMAP = payload.tokens;
  BOOKS = BOOKS.concat(payload.books);
  INDEX = byId();
  for (const b of BOOKS){                       // backlinks from the vault half
    for (const raw of b.links){
      const tgt = INDEX[deref(raw)];
      if (tgt && !tgt.backlinks.includes(b.slug)) tgt.backlinks.push(b.slug);
    }
  }
  $("#lock").hidden = true;
  G = null; if (mapping) buildGraph();
  setSub("vault open");
  draw($("#q").value);
  if (current) open(current);
}

async function attempt(pass){
  const msg = $("#lockmsg");
  msg.hidden = false;
  msg.textContent = "deriving key…";
  try {
    const v = await unlock(pass);
    try { sessionStorage.setItem("memex-pass", pass); } catch(_){}
    admit(v);
  } catch (err){
    msg.textContent = String(err.message || err).includes("WebCrypto")
      ? "WebCrypto unavailable — serve the file over localhost instead"
      : "wrong passphrase";
    $("#pass").value = "";
    $("#pass").focus();
  }
}


/* ---------- the map: Books as nodes, wiki-links as edges ---------- */
const cv = $("#map"), cx = cv.getContext("2d");
let G = null, view = {x:0, y:0, k:1}, cooling = 0, raf = null, mapping = false;

const HUE = {};
function hue(shelf){
  if (!(shelf in HUE)){
    let h = 7;
    for (const c of shelf) h = (h * 31 + c.charCodeAt(0)) % 360;
    HUE[shelf] = h;
  }
  return HUE[shelf];
}
const dark = () => matchMedia("(prefers-color-scheme:dark)").matches;

function buildGraph(){
  const nodes = BOOKS.map(b => ({slug:b.slug, title:b.title, shelf:b.shelf,
    vault:!!b.vault, deg:0, x:0, y:0, vx:0, vy:0}));
  const at = {};
  for (const n of nodes) at[n.slug] = n;
  const edges = [], seen = new Set();
  for (const b of BOOKS){
    for (const raw of b.links){
      const t = deref(raw);
      if (!t || !at[t] || t === b.slug) continue;
      const key = b.slug < t ? b.slug + "|" + t : t + "|" + b.slug;
      if (seen.has(key)) continue;
      seen.add(key);
      edges.push({a:at[b.slug], b:at[t]});
      at[b.slug].deg++; at[t].deg++;
    }
  }
  nodes.forEach((n, i) => {                    // seed on a circle, grouped by shelf
    const a = (i / nodes.length) * Math.PI * 2;
    n.x = Math.cos(a) * 300; n.y = Math.sin(a) * 300;
  });
  G = {nodes, edges};
  cooling = 420;
}

function tick(){
  const {nodes, edges} = G;
  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++){
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy || 0.01;
      const d = Math.sqrt(d2), f = 3000 / d2;
      const ux = dx/d, uy = dy/d;
      a.vx -= ux*f; a.vy -= uy*f; b.vx += ux*f; b.vy += uy*f;
    }
  }
  for (const e of edges){                       // springs pull linked Books together
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const f = (d - 95) * 0.016, ux = dx/d, uy = dy/d;
    e.a.vx += ux*f; e.a.vy += uy*f; e.b.vx -= ux*f; e.b.vy -= uy*f;
  }
  for (const n of G.nodes){
    n.vx -= n.x * 0.0022; n.vy -= n.y * 0.0022;   // gravity, so it stays on screen
    n.vx *= 0.84; n.vy *= 0.84;
    n.x += n.vx; n.y += n.vy;
  }
}

const radius = n => 4 + Math.sqrt(n.deg) * 2.6;

function matches(n, f){
  if (!f) return true;
  const b = INDEX[n.slug];
  return n.title.toLowerCase().includes(f) || n.slug.includes(f)
      || (b && b.text.includes(f));
}

function paint(){
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);
  cx.save();
  cx.translate(w/2 + view.x, h/2 + view.y);
  cx.scale(view.k, view.k);

  const f = $("#q").value.trim().toLowerCase();
  const lit = n => matches(n, f);
  const ink = dark() ? 230 : 35;

  cx.lineWidth = 1 / view.k;
  for (const e of G.edges){
    const on = lit(e.a) && lit(e.b);
    const near = current && (e.a.slug === current || e.b.slug === current);
    cx.strokeStyle = near ? `hsla(28,60%,${dark()?62:40}%,.85)`
                          : `rgba(${ink},${ink},${ink},${on ? .16 : .05})`;
    cx.beginPath(); cx.moveTo(e.a.x, e.a.y); cx.lineTo(e.b.x, e.b.y); cx.stroke();
  }
  for (const n of G.nodes){
    const on = lit(n), r = radius(n), sel = n.slug === current;
    cx.beginPath(); cx.arc(n.x, n.y, r, 0, 6.284);
    cx.fillStyle = n.vault
      ? `hsla(${dark()?340:335},45%,${dark()?62:42}%,${on ? .95 : .18})`
      : `hsla(${hue(n.shelf)},${on ? 42 : 20}%,${dark()?60:45}%,${on ? .9 : .16})`;
    cx.fill();
    if (sel){
      cx.strokeStyle = dark() ? "#e6e1d6" : "#23211d";
      cx.lineWidth = 2 / view.k; cx.stroke(); cx.lineWidth = 1 / view.k;
    }
    if (on && (view.k > 1.05 || n.deg >= 4 || sel)){
      cx.fillStyle = `rgba(${ink},${ink},${ink},${sel ? .95 : .62})`;
      cx.font = `${11 / view.k}px ui-sans-serif,system-ui,sans-serif`;
      cx.fillText(n.title.length > 26 ? n.title.slice(0, 25) + "…" : n.title,
                  n.x + r + 3/view.k, n.y + 3.5/view.k);
    }
  }
  cx.restore();
}

function loop(){
  if (!mapping) { raf = null; return; }
  if (cooling > 0){ tick(); cooling--; }
  paint();
  raf = requestAnimationFrame(loop);
}

function at(ev){
  const r = cv.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top};
}
function toWorld(p){
  return {x: (p.x - cv.clientWidth/2 - view.x) / view.k,
          y: (p.y - cv.clientHeight/2 - view.y) / view.k};
}
function pick(p){
  const w = toWorld(p);
  let best = null, bd = 1e9;
  for (const n of G.nodes){
    const d = Math.hypot(n.x - w.x, n.y - w.y);
    if (d < radius(n) + 10/view.k && d < bd){ bd = d; best = n; }
  }
  return best;
}

/* pan, pinch, tap — one pointer model for trackpad and touchscreen alike */
const live = new Map();
let last = null, moved = 0, pinch = 0;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  live.set(e.pointerId, at(e));
  last = at(e); moved = 0;
});
cv.addEventListener("pointermove", e => {
  if (!live.has(e.pointerId)) return;
  live.set(e.pointerId, at(e));
  const pts = [...live.values()];
  if (pts.length >= 2){
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinch) view.k = Math.min(4, Math.max(.25, view.k * (d / pinch)));
    pinch = d; moved = 99;
    return;
  }
  const p = at(e);
  view.x += p.x - last.x; view.y += p.y - last.y;
  moved += Math.abs(p.x - last.x) + Math.abs(p.y - last.y);
  last = p;
});
function release(e){
  if (live.size < 2) pinch = 0;
  live.delete(e.pointerId);
  if (live.size === 0 && moved < 6){
    const n = pick(at(e));
    if (n){ open(n.slug); setView("list"); }
  }
  last = null;
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  view.k = Math.min(4, Math.max(.25, view.k * (e.deltaY < 0 ? 1.1 : 1/1.1)));
}, {passive:false});

function setView(v){
  mapping = (v === "map");
  document.body.classList.toggle("mapping", mapping);
  cv.classList.toggle("on", mapping);
  $("#maphint").hidden = !mapping;
  $("#v-map").classList.toggle("on", mapping);
  $("#v-list").classList.toggle("on", !mapping);
  if (mapping){
    if (!G) buildGraph();
    if (!raf) loop();
  }
}
$("#v-map").onclick = () => setView("map");
$("#v-list").onclick = () => setView("list");

/* ---------- boot ---------- */
function setSub(note){
  const live = $("#live");
  $("#sub").textContent = COUNTS.total + " Books · " + note + " ";
  $("#sub").append(live);
}

async function setVault(pass){
  const msg = $("#lockmsg");
  msg.hidden = false; msg.textContent = "checking…";
  const r = await fetch("api/vault", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({passphrase: pass})});
  if (!r.ok){                       // 403: does not match the enrolled one
    msg.textContent = r.status === 403 ? "wrong passphrase" : "refused";
    $("#pass").value = ""; $("#pass").focus();
    return;
  }
  try { sessionStorage.setItem("memex-pass", pass); } catch(_){}
  await reload();
}

function wireLock(){
  const omitted = COUNTS.vault && !LOCKED ? COUNTS.vault : 0;
  if (LIVE && COUNTS.vaultSet === false){
    $("#lock").hidden = false;
    $("#pass").hidden = false; $("#unlock").hidden = false;
    const first = !COUNTS.vaultEnrolled;
    $("#lockp").textContent = COUNTS.vault + " Books are vault. "
      + (first
         ? "Choose a passphrase — it is held in memory only, and this first "
           + "one is the one that counts from now on."
         : "Enter your passphrase. It is held in memory only, so it is asked "
           + "again after a reboot.");
    $("#unlock").textContent = first ? "Set passphrase" : "Unlock vault";
    $("#pass").placeholder = first ? "new passphrase" : "passphrase";
    $("#unlock").onclick = () => setVault($("#pass").value);
    $("#pass").onkeydown = e => { if (e.key === "Enter") setVault($("#pass").value); };
    return;
  }
  $("#unlock").textContent = "Unlock";
  $("#pass").placeholder = "passphrase";
  if (LOCKED){
    $("#lock").hidden = false;
    $("#lockp").textContent = COUNTS.vault + " Books are encrypted. "
      + "Without the passphrase they are not here.";
    $("#unlock").onclick = () => attempt($("#pass").value);
    $("#pass").onkeydown = e => { if (e.key === "Enter") attempt($("#pass").value); };
    let saved = null;
    try { saved = sessionStorage.getItem("memex-pass"); } catch(_){}
    if (saved) attempt(saved);
  } else if (omitted){
    $("#lock").hidden = false;
    $("#lockp").textContent = omitted + " vault Books are not in this page.";
    $("#pass").hidden = true; $("#unlock").hidden = true;
  }
}

/* ---------- live: brain/ is the source of truth, so follow it ---------- */
async function reload(){
  const r = await fetch("api/library", {cache:"no-store"});
  const d = await r.json();
  BOOKS = d.public; LOCKED = d.locked; COUNTS = d.counts;
  INDEX = byId(); VAULTMAP = null; G = null;
  setSub("live");
  wireLock();                       // re-unlocks from sessionStorage on its own
  draw($("#q").value);
  const want = current || decodeURIComponent(location.hash.slice(1));
  if (want && INDEX[want]) open(want);
  const dot = $("#live");
  dot.textContent = "updated"; dot.classList.add("beat");
  setTimeout(() => { dot.textContent = "live"; dot.classList.remove("beat"); }, 1500);
}

async function watch(){
  let seen = null, page = null;
  for(;;){
    try {
      const r = await fetch("api/version", {cache:"no-store"});
      const {v, p} = await r.json();
      // the page itself was rebuilt -- reload, so no one has to pull-to-refresh
      if (page === null) page = p;
      else if (p !== page){ location.reload(); return; }
      if (seen === null) seen = v;
      else if (v !== seen){ seen = v; await reload(); }
      $("#live").textContent = $("#live").textContent || "live";
    } catch(_) {
      $("#live").textContent = "offline";
    }
    await new Promise(r => setTimeout(r, 2000));
  }
}

if (LIVE){
  $("#live").textContent = "live";
  reload().then(watch);
} else {
  setSub("built " + COUNTS.built);
  wireLock();
}

$("#q").oninput = () => { draw($("#q").value); if (mapping && !raf) loop(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")
      && document.activeElement !== $("#pass")){
    e.preventDefault(); $("#q").focus();
  }
  if (e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; draw(""); $("#q").blur();
  }
});
window.addEventListener("hashchange", () => {
  const s = decodeURIComponent(location.hash.slice(1));
  if (s && s !== current) open(s);
});

draw("");
const first = decodeURIComponent(location.hash.slice(1));
if (first && INDEX[first]) open(first);
})();
</script>
